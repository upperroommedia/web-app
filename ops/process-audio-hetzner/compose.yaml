name: process-audio-hetzner

services:
  ytdlp-pot-provider:
    image: docker.io/brainicism/bgutil-ytdlp-pot-provider:1.3.1
    restart: unless-stopped
    expose:
      - "4416"

  browser-auth:
    image: lscr.io/linuxserver/chromium:latest
    profiles:
      - browser-auth
    shm_size: "1gb"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: UTC
      CHROME_CLI: /config/.config/chromium
    volumes:
      - ./state/shared-browser-profile:/config
    ports:
      - "127.0.0.1:3010:3000"
    restart: unless-stopped

  process-audio-staging:
    build:
      context: ./context
      dockerfile: apps/process-audio/Dockerfile
    command:
      - /bin/sh
      - -lc
      - |
        credential_path=/workspace/logs/firebase-service-account.json
        printf '%s' "$$FIREBASE_SERVICE_ACCOUNT_JSON" | base64 -d > "$$credential_path"
        export GOOGLE_APPLICATION_CREDENTIALS="$$credential_path"
        exec pnpm start
    env_file:
      - ./env/process-audio-staging.env
    depends_on:
      - ytdlp-pot-provider
    volumes:
      - ./state/staging/tmp:/tmp
      - ./state/staging/logs:/workspace/logs
      - ./state/shared-browser-profile:/workspace/shared-browser-profile:ro
    restart: unless-stopped
    expose:
      - "8080"

  process-audio-production:
    build:
      context: ./context
      dockerfile: apps/process-audio/Dockerfile
    command:
      - /bin/sh
      - -lc
      - |
        credential_path=/workspace/logs/firebase-service-account.json
        printf '%s' "$$FIREBASE_SERVICE_ACCOUNT_JSON" | base64 -d > "$$credential_path"
        export GOOGLE_APPLICATION_CREDENTIALS="$$credential_path"
        exec pnpm start
    env_file:
      - ./env/process-audio-production.env
    depends_on:
      - ytdlp-pot-provider
    volumes:
      - ./state/production/tmp:/tmp
      - ./state/production/logs:/workspace/logs
      - ./state/shared-browser-profile:/workspace/shared-browser-profile:ro
    restart: unless-stopped
    expose:
      - "8080"

  caddy:
    image: caddy:2.10.0
    depends_on:
      - process-audio-staging
      - process-audio-production
    environment:
      PROCESS_AUDIO_STAGING_HOSTNAME: ${PROCESS_AUDIO_STAGING_HOSTNAME}
      PROCESS_AUDIO_PRODUCTION_HOSTNAME: ${PROCESS_AUDIO_PRODUCTION_HOSTNAME}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./state/caddy/data:/data
      - ./state/caddy/config:/config
    restart: unless-stopped
