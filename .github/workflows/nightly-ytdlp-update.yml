name: nightly-media-tool-update

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: process-audio-hetzner-host
  cancel-in-progress: false

jobs:
  update-media-tool-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v5
        with:
          ref: staging
          fetch-depth: 0

      - id: version-check
        name: Resolve latest stable media runtime versions
        run: |
          set -euo pipefail
          set -a
          source ops/process-audio-hetzner/media-runtime-versions.env
          set +a
          current_ytdlp_version="$PROCESS_AUDIO_YTDLP_VERSION"
          current_ffmpeg_version="$PROCESS_AUDIO_FFMPEG_VERSION"
          current_deno_version="$PROCESS_AUDIO_DENO_VERSION"
          current_pot_provider_version="$PROCESS_AUDIO_BGUTIL_VERSION"
          current_pot_provider_image_version="$(python3 -c "import os, re; image = os.environ['PROCESS_AUDIO_BGUTIL_IMAGE']; match = re.fullmatch(r'docker\.io/brainicism/bgutil-ytdlp-pot-provider:([^@]+)@(sha256:[0-9a-f]{64})', image); assert match, 'Invalid provider image in media runtime version contract'; print(match.group(1))")"
          current_pot_provider_digest="${PROCESS_AUDIO_BGUTIL_IMAGE##*@}"
          current_playwright_version="$(python3 -c "import re, pathlib; text = pathlib.Path('apps/browser-fallback/Dockerfile').read_text(); match = re.search(r'^ARG PLAYWRIGHT_VERSION=(.+)$', text, re.MULTILINE); assert match, 'Could not locate PLAYWRIGHT_VERSION in Dockerfile'; print(match.group(1).strip())")"
          process_runtime_contract_current="$(python3 - <<'PY'
          import os, pathlib, re
          common_expected = {
              'YT_DLP_VERSION': os.environ['PROCESS_AUDIO_YTDLP_VERSION'],
              'DENO_VERSION': os.environ['PROCESS_AUDIO_DENO_VERSION'],
              'BGUTIL_YTDLP_POT_PROVIDER_VERSION': os.environ['PROCESS_AUDIO_BGUTIL_VERSION'],
          }
          dockerfile_paths = [
              pathlib.Path('apps/process-audio/Dockerfile'),
              pathlib.Path('apps/browser-fallback/Dockerfile'),
              pathlib.Path('Dockerfile.browser-fallback-cloudflare'),
          ]
          dockerfile_matches = all(
              re.search(rf'^ARG {name}={re.escape(value)}$', path.read_text(), re.MULTILINE)
              for path in dockerfile_paths
              for name, value in common_expected.items()
          )
          process_dockerfile = dockerfile_paths[0].read_text()
          dockerfile_matches = dockerfile_matches and bool(re.search(
              rf'^ARG FFMPEG_VERSION={re.escape(os.environ["PROCESS_AUDIO_FFMPEG_VERSION"])}$',
              process_dockerfile,
              re.MULTILINE,
          ))
          compose = pathlib.Path('ops/process-audio-hetzner/compose.yaml').read_text()
          compose_matches = compose.count('image: ${PROCESS_AUDIO_BGUTIL_IMAGE:?PROCESS_AUDIO_BGUTIL_IMAGE is required}') == 2
          smoke = pathlib.Path('scripts/verify-hetzner-ytdlp-smoke.sh').read_text()
          smoke_matches = 'media-runtime-versions.env' in smoke and 'EXPECTED_YTDLP_VERSION="${PROCESS_AUDIO_YTDLP_VERSION:' in smoke
          print('true' if dockerfile_matches and compose_matches and smoke_matches else 'false')
          PY
          )"

          latest_ytdlp_version="$(curl -fsSL https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest | python3 -c "import json, sys; data = json.load(sys.stdin); tag = (data.get('tag_name') or '').strip(); assert tag, 'No latest yt-dlp release tag found'; print(tag.lstrip('v'))")"
          latest_ffmpeg_version="$(curl -fsSL https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest | python3 -c "import json, re, sys; data = json.load(sys.stdin); names = {asset.get('name', '') for asset in data.get('assets', [])}; versions = []; pattern = re.compile(r'^ffmpeg-n([0-9]+(?:\\.[0-9]+){1,2})-latest-linux64-gpl-\\1\\.tar\\.xz$'); [versions.append(match.group(1)) for name in names for match in [pattern.match(name)] if match and f'ffmpeg-n{match.group(1)}-latest-linuxarm64-gpl-{match.group(1)}.tar.xz' in names]; assert versions, 'No compatible BtbN ffmpeg release assets found'; print(sorted(set(versions), key=lambda s: [int(x) for x in s.split('.')])[-1])")"
          latest_deno_version="$(curl -fsSL https://api.github.com/repos/denoland/deno/releases/latest | python3 -c "import json, sys; data = json.load(sys.stdin); tag = (data.get('tag_name') or '').strip(); assert tag, 'No latest Deno release tag found'; print(tag.lstrip('v'))")"
          latest_pot_provider_version="$(curl -fsSL https://pypi.org/pypi/bgutil-ytdlp-pot-provider/json | python3 -c "import json, sys; data = json.load(sys.stdin); version = (data.get('info', {}).get('version') or '').strip(); assert version, 'No latest bgutil PO-token provider version found'; print(version)")"
          provider_registry_token="$(curl -fsSL --get 'https://auth.docker.io/token' --data-urlencode 'service=registry.docker.io' --data-urlencode 'scope=repository:brainicism/bgutil-ytdlp-pot-provider:pull' | python3 -c "import json, sys; token = json.load(sys.stdin).get('token', '').strip(); assert token, 'No Docker Hub registry token returned'; print(token)")"
          latest_pot_provider_digest="$(curl -fsSI -H "Authorization: Bearer ${provider_registry_token}" -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' "https://registry-1.docker.io/v2/brainicism/bgutil-ytdlp-pot-provider/manifests/${latest_pot_provider_version}" | tr -d '\r' | awk 'tolower($1) == "docker-content-digest:" { print $2 }')"
          [[ "$latest_pot_provider_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Could not resolve OCI digest for bgutil provider ${latest_pot_provider_version}" >&2; exit 1; }
          expected_pot_provider_image="docker.io/brainicism/bgutil-ytdlp-pot-provider:${latest_pot_provider_version}@${latest_pot_provider_digest}"
          pot_provider_refs_current="$(EXPECTED_POT_PROVIDER_IMAGE="$expected_pot_provider_image" python3 -c "import os, pathlib; expected = os.environ['EXPECTED_POT_PROVIDER_IMAGE']; files = {'apps/process-audio/compose.dev.yaml': 1, 'apps/process-audio/compose.youtube-test.yaml': 1}; print('true' if all(pathlib.Path(path).read_text().count(f'image: {expected}') == count for path, count in files.items()) else 'false')")"
          latest_playwright_version="$(curl -fsSL https://registry.npmjs.org/playwright/latest | python3 -c "import json, sys; data = json.load(sys.stdin); version = (data.get('version') or '').strip(); assert version, 'No latest Playwright version found'; print(version)")"
          for arch in linux64 linuxarm64; do
            curl -fsSI "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n${latest_ffmpeg_version}-latest-${arch}-gpl-${latest_ffmpeg_version}.tar.xz" >/dev/null
          done

          should_update=false
          if [[ "$current_ytdlp_version" != "$latest_ytdlp_version" || "$current_ffmpeg_version" != "$latest_ffmpeg_version" || "$current_deno_version" != "$latest_deno_version" || "$current_pot_provider_version" != "$latest_pot_provider_version" || "$current_pot_provider_image_version" != "$latest_pot_provider_version" || "$current_pot_provider_digest" != "$latest_pot_provider_digest" || "$pot_provider_refs_current" != "true" || "$process_runtime_contract_current" != "true" || "$current_playwright_version" != "$latest_playwright_version" ]]; then
            should_update=true
          fi

          {
            echo "current_ytdlp_version=$current_ytdlp_version"
            echo "latest_ytdlp_version=$latest_ytdlp_version"
            echo "current_ffmpeg_version=$current_ffmpeg_version"
            echo "latest_ffmpeg_version=$latest_ffmpeg_version"
            echo "current_deno_version=$current_deno_version"
            echo "latest_deno_version=$latest_deno_version"
            echo "current_pot_provider_version=$current_pot_provider_version"
            echo "current_pot_provider_image_version=$current_pot_provider_image_version"
            echo "latest_pot_provider_version=$latest_pot_provider_version"
            echo "current_pot_provider_digest=$current_pot_provider_digest"
            echo "latest_pot_provider_digest=$latest_pot_provider_digest"
            echo "pot_provider_refs_current=$pot_provider_refs_current"
            echo "process_runtime_contract_current=$process_runtime_contract_current"
            echo "current_playwright_version=$current_playwright_version"
            echo "latest_playwright_version=$latest_playwright_version"
            echo "should_update=$should_update"
          } >> "$GITHUB_OUTPUT"

      - name: Exit when media tools are already current
        if: steps.version-check.outputs.should_update != 'true'
        run: echo "yt-dlp, ffmpeg, Deno, the PO-token provider, and Playwright are already current; no update needed."

      - name: Bump pinned media runtime versions
        if: steps.version-check.outputs.should_update == 'true'
        env:
          LATEST_YTDLP_VERSION: ${{ steps.version-check.outputs.latest_ytdlp_version }}
          LATEST_FFMPEG_VERSION: ${{ steps.version-check.outputs.latest_ffmpeg_version }}
          LATEST_DENO_VERSION: ${{ steps.version-check.outputs.latest_deno_version }}
          LATEST_POT_PROVIDER_VERSION: ${{ steps.version-check.outputs.latest_pot_provider_version }}
          LATEST_POT_PROVIDER_DIGEST: ${{ steps.version-check.outputs.latest_pot_provider_digest }}
          LATEST_PLAYWRIGHT_VERSION: ${{ steps.version-check.outputs.latest_playwright_version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re
          version_contract_path = pathlib.Path('ops/process-audio-hetzner/media-runtime-versions.env')
          version_contract = (
              '# Process-audio media runtime release contract.\n'
              '# Keep this file shell-compatible: deploy, smoke, Compose, and the nightly updater consume it.\n'
              f"PROCESS_AUDIO_YTDLP_VERSION={os.environ['LATEST_YTDLP_VERSION']}\n"
              f"PROCESS_AUDIO_FFMPEG_VERSION={os.environ['LATEST_FFMPEG_VERSION']}\n"
              f"PROCESS_AUDIO_DENO_VERSION={os.environ['LATEST_DENO_VERSION']}\n"
              f"PROCESS_AUDIO_BGUTIL_VERSION={os.environ['LATEST_POT_PROVIDER_VERSION']}\n"
              f"PROCESS_AUDIO_BGUTIL_IMAGE=docker.io/brainicism/bgutil-ytdlp-pot-provider:{os.environ['LATEST_POT_PROVIDER_VERSION']}@{os.environ['LATEST_POT_PROVIDER_DIGEST']}\n"
          )
          changed = version_contract_path.read_text() != version_contract
          version_contract_path.write_text(version_contract)
          dockerfiles = [
              pathlib.Path('apps/process-audio/Dockerfile'),
              pathlib.Path('apps/browser-fallback/Dockerfile'),
              pathlib.Path('Dockerfile.browser-fallback-cloudflare'),
          ]
          for path in dockerfiles:
              text = path.read_text()
              updated = re.sub(r'(^ARG YT_DLP_VERSION=).+$', rf"\g<1>{os.environ['LATEST_YTDLP_VERSION']}", text, flags=re.MULTILINE)
              updated = re.sub(r'(^ARG DENO_VERSION=).+$', rf"\g<1>{os.environ['LATEST_DENO_VERSION']}", updated, flags=re.MULTILINE)
              updated = re.sub(r'(^ARG BGUTIL_YTDLP_POT_PROVIDER_VERSION=).+$', rf"\g<1>{os.environ['LATEST_POT_PROVIDER_VERSION']}", updated, flags=re.MULTILINE)
              updated = re.sub(r'(^ARG PLAYWRIGHT_VERSION=).+$', rf"\g<1>{os.environ['LATEST_PLAYWRIGHT_VERSION']}", updated, flags=re.MULTILINE)
              if path == pathlib.Path('apps/process-audio/Dockerfile'):
                  updated = re.sub(r'(^ARG FFMPEG_VERSION=).+$', rf"\g<1>{os.environ['LATEST_FFMPEG_VERSION']}", updated, flags=re.MULTILINE)
              if updated != text:
                  path.write_text(updated)
                  changed = True

          for path, section, package in [
              (pathlib.Path('apps/browser-fallback/package.json'), 'dependencies', 'playwright'),
              (pathlib.Path('apps/web/package.json'), 'devDependencies', '@playwright/test'),
          ]:
              data = json.loads(path.read_text())
              expected = f"^{os.environ['LATEST_PLAYWRIGHT_VERSION']}"
              if data[section][package] != expected:
                  data[section][package] = expected
                  path.write_text(json.dumps(data, indent=2) + '\n')
                  changed = True

          provider_image = f"docker.io/brainicism/bgutil-ytdlp-pot-provider:{os.environ['LATEST_POT_PROVIDER_VERSION']}@{os.environ['LATEST_POT_PROVIDER_DIGEST']}"
          for path in [
              pathlib.Path('apps/process-audio/compose.dev.yaml'),
              pathlib.Path('apps/process-audio/compose.youtube-test.yaml'),
          ]:
              text = path.read_text()
              updated = re.sub(
                  r'docker\.io/brainicism/bgutil-ytdlp-pot-provider:[^\s]+',
                  provider_image,
                  text,
              )
              if updated != text:
                  path.write_text(updated)
                  changed = True
          ops_compose = pathlib.Path('ops/process-audio-hetzner/compose.yaml').read_text()
          assert ops_compose.count('image: ${PROCESS_AUDIO_BGUTIL_IMAGE:?PROCESS_AUDIO_BGUTIL_IMAGE is required}') == 2, 'Hetzner Compose must consume the shared provider image contract'
          assert changed, 'Pinned media runtime files did not change during version bump'
          PY
          npm install --global pnpm@10.10.0
          pnpm install --lockfile-only

      - name: Commit and open version bump PR
        if: steps.version-check.outputs.should_update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST_YTDLP_VERSION: ${{ steps.version-check.outputs.latest_ytdlp_version }}
          LATEST_FFMPEG_VERSION: ${{ steps.version-check.outputs.latest_ffmpeg_version }}
          LATEST_DENO_VERSION: ${{ steps.version-check.outputs.latest_deno_version }}
          LATEST_POT_PROVIDER_VERSION: ${{ steps.version-check.outputs.latest_pot_provider_version }}
          LATEST_POT_PROVIDER_DIGEST: ${{ steps.version-check.outputs.latest_pot_provider_digest }}
          LATEST_PLAYWRIGHT_VERSION: ${{ steps.version-check.outputs.latest_playwright_version }}
        run: |
          set -euo pipefail
          branch_name="automation/media-tool-update"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch_name"
          git add ops/process-audio-hetzner/media-runtime-versions.env apps/process-audio/Dockerfile apps/browser-fallback/Dockerfile Dockerfile.browser-fallback-cloudflare apps/process-audio/compose.dev.yaml apps/process-audio/compose.youtube-test.yaml ops/process-audio-hetzner/compose.yaml apps/browser-fallback/package.json apps/web/package.json pnpm-lock.yaml
          git commit -m "Bump pinned media runtimes"
          git push --force-with-lease origin HEAD:"$branch_name"

          title="Bump pinned media runtimes"
          printf -v body 'Automated media-runtime update for the process-audio Hetzner worker and browser fallbacks.\n\n- yt-dlp: %s\n- ffmpeg: %s\n- Deno: %s\n- bgutil PO-token provider: %s@%s\n- Playwright: %s\n\nThis PR targets staging because the branch is protected and requires normal PR checks before deploy workflows can run.' "$LATEST_YTDLP_VERSION" "$LATEST_FFMPEG_VERSION" "$LATEST_DENO_VERSION" "$LATEST_POT_PROVIDER_VERSION" "$LATEST_POT_PROVIDER_DIGEST" "$LATEST_PLAYWRIGHT_VERSION"
          existing_pr="$(gh pr list --base staging --head "$branch_name" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing_pr" ]]; then
            gh pr edit "$existing_pr" --title "$title" --body "$body"
            gh pr view "$existing_pr" --json url --jq .url
          else
            gh pr create --base staging --head "$branch_name" --title "$title" --body "$body"
          fi
