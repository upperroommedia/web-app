name: nightly-media-tool-update

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: process-audio-hetzner-host
  cancel-in-progress: false

jobs:
  update-media-tool-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v5
        with:
          ref: staging
          fetch-depth: 0

      - id: version-check
        name: Resolve latest stable yt-dlp and ffmpeg versions
        run: |
          set -euo pipefail
          current_ytdlp_version="$(python3 -c "import re, pathlib; text = pathlib.Path('apps/process-audio/Dockerfile').read_text(); match = re.search(r'^ARG YT_DLP_VERSION=(.+)$', text, re.MULTILINE); assert match, 'Could not locate YT_DLP_VERSION in Dockerfile'; print(match.group(1).strip())")"
          current_ffmpeg_version="$(python3 -c "import re, pathlib; text = pathlib.Path('apps/process-audio/Dockerfile').read_text(); match = re.search(r'^ARG FFMPEG_VERSION=(.+)$', text, re.MULTILINE); assert match, 'Could not locate FFMPEG_VERSION in Dockerfile'; print(match.group(1).strip())")"

          latest_ytdlp_version="$(curl -fsSL https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest | python3 -c "import json, sys; data = json.load(sys.stdin); tag = (data.get('tag_name') or '').strip(); assert tag, 'No latest yt-dlp release tag found'; print(tag.lstrip('v'))")"
          latest_ffmpeg_version="$(curl -fsSL https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest | python3 -c "import json, re, sys; data = json.load(sys.stdin); names = {asset.get('name', '') for asset in data.get('assets', [])}; versions = []; pattern = re.compile(r'^ffmpeg-n([0-9]+(?:\\.[0-9]+){1,2})-latest-linux64-gpl-\\1\\.tar\\.xz$'); [versions.append(match.group(1)) for name in names for match in [pattern.match(name)] if match and f'ffmpeg-n{match.group(1)}-latest-linuxarm64-gpl-{match.group(1)}.tar.xz' in names]; assert versions, 'No compatible BtbN ffmpeg release assets found'; print(sorted(set(versions), key=lambda s: [int(x) for x in s.split('.')])[-1])")"
          for arch in linux64 linuxarm64; do
            curl -fsSI "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n${latest_ffmpeg_version}-latest-${arch}-gpl-${latest_ffmpeg_version}.tar.xz" >/dev/null
          done

          should_update=false
          if [[ "$current_ytdlp_version" != "$latest_ytdlp_version" || "$current_ffmpeg_version" != "$latest_ffmpeg_version" ]]; then
            should_update=true
          fi

          {
            echo "current_ytdlp_version=$current_ytdlp_version"
            echo "latest_ytdlp_version=$latest_ytdlp_version"
            echo "current_ffmpeg_version=$current_ffmpeg_version"
            echo "latest_ffmpeg_version=$latest_ffmpeg_version"
            echo "should_update=$should_update"
          } >> "$GITHUB_OUTPUT"

      - name: Exit when media tools are already current
        if: steps.version-check.outputs.should_update != 'true'
        run: echo "yt-dlp and ffmpeg are already current; no update needed."

      - name: Bump pinned yt-dlp and ffmpeg versions
        if: steps.version-check.outputs.should_update == 'true'
        env:
          LATEST_YTDLP_VERSION: ${{ steps.version-check.outputs.latest_ytdlp_version }}
          LATEST_FFMPEG_VERSION: ${{ steps.version-check.outputs.latest_ffmpeg_version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re
          path = pathlib.Path('apps/process-audio/Dockerfile')
          text = path.read_text()
          updated = re.sub(r'(^ARG YT_DLP_VERSION=).+$', rf"\g<1>{os.environ['LATEST_YTDLP_VERSION']}", text, flags=re.MULTILINE)
          updated = re.sub(r'(^ARG FFMPEG_VERSION=).+$', rf"\g<1>{os.environ['LATEST_FFMPEG_VERSION']}", updated, flags=re.MULTILINE)
          assert updated != text, 'Dockerfile did not change during media tool version bump'
          path.write_text(updated)
          PY

      - name: Commit and open version bump PR
        if: steps.version-check.outputs.should_update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST_YTDLP_VERSION: ${{ steps.version-check.outputs.latest_ytdlp_version }}
          LATEST_FFMPEG_VERSION: ${{ steps.version-check.outputs.latest_ffmpeg_version }}
        run: |
          set -euo pipefail
          branch_name="automation/media-tool-update"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch_name"
          git add apps/process-audio/Dockerfile
          git commit -m "Bump media tools to yt-dlp ${LATEST_YTDLP_VERSION} and ffmpeg ${LATEST_FFMPEG_VERSION}"
          git push --force-with-lease origin HEAD:"$branch_name"

          title="Bump media tools to yt-dlp ${LATEST_YTDLP_VERSION} and ffmpeg ${LATEST_FFMPEG_VERSION}"
          body=$'Automated media-tool version bump for the process-audio Hetzner worker.\n\nThis PR targets `staging` because the branch is protected and requires normal PR checks before deploy workflows can run.'
          existing_pr="$(gh pr list --base staging --head "$branch_name" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing_pr" ]]; then
            gh pr edit "$existing_pr" --title "$title" --body "$body"
            gh pr view "$existing_pr" --json url --jq .url
          else
            gh pr create --base staging --head "$branch_name" --title "$title" --body "$body"
          fi
