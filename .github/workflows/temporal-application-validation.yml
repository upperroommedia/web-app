name: Temporal application validation

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'functions*/**'
      - 'function-kits/**'
      - 'packages/**'
      - 'scripts/**'
      - 'patches/**'
      - '*rules*'
      - '*index*'
      - '*json'
      - 'pnpm-*.yaml'
      - '.github/workflows/temporal-application-validation.yml'
      - '.github/workflows/*process-audio*deploy.yml'
      - 'ops/process-audio-hetzner/**'
      - 'ops/local-validation/**'
  push:
    branches: [staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporal-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  durable-application:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.23.3'
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21.0.12.1'
      - name: Install pinned package manager and native test tools
        run: |
          npm install --global pnpm@12.11.2
          sudo apt-get update
          sudo apt-get install --yes ffmpeg rsync
      - name: Set up read-only upload manifest validation
        uses: google-github-actions/setup-gcloud@v3.0.1
        with:
          version: '588.0.0'
      - name: Validate the complete application
        id: application_validation
        run: node scripts/validate-application.mjs
      - name: Preserve authenticated media failure traces
        if: ${{ failure() && steps.application_validation.outputs.media_failed == 'true' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: authenticated-media-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/test-results/
          if-no-files-found: warn
          retention-days: 3
      - name: Preserve validation summary
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: application-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/validation/application-summary.json
            output/validation/temporal-worker-summary.json
          if-no-files-found: warn
          retention-days: 3
