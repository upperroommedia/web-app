name: Temporal application release
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        required: true
      operation:
        type: choice
        options:
          [
            freeze-ui,
            compatibility-ready,
            drain,
            workers-ready,
            provider-usage-ready,
            take-ownership,
            backend-ready,
            bootstrap-bundles,
            rollout-ui,
            open,
            restore-auto,
            pause,
            resume,
            rollback-ui,
            restore-reviewed-ui,
          ]
        required: true
permissions:
  contents: read
concurrency:
  group: temporal-platform-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ${{ fromJSON(format('["self-hosted","linux","temporal-infrastructure","{0}"]', inputs.environment)) }}
    environment: temporal-${{ inputs.environment }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6.0.2
      - name: Install frozen application dependencies
        run: pnpm install --frozen-lockfile
      - name: Run reviewed release checkpoint
        env:
          RELEASE_CONFIG: ${{ secrets.TEMPORAL_RELEASE_CONFIG_JSON }}
          OPERATION: ${{ inputs.operation }}
        run: |
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          umask 077
          printf '%s' "$RELEASE_CONFIG" > "$work/release.json"
          node scripts/temporal-release.mjs "$OPERATION" --release "$work/release.json" --apply
