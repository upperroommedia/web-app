name: staging-process-audio-hetzner-deploy

on:
  push:
    branches:
      - staging
    paths:
      - 'apps/process-audio/**'
      - 'packages/contracts/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'turbo.json'
      - '.npmrc'
      - 'ops/process-audio-hetzner/**'
      - 'scripts/deploy-process-audio-hetzner.sh'
      - 'scripts/prepare-process-audio-hetzner-context.sh'
      - 'scripts/verify-hetzner-ytdlp-smoke.sh'
      - 'scripts/wait-for-process-audio-health.sh'
      - '.github/workflows/staging-process-audio-hetzner-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: process-audio-hetzner-host
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GCP_PROJECT: urm-app-staging
      PROCESS_AUDIO_HETZNER_STAGING_HOSTNAME: yt-worker-staging.upperroommedia.org
      PROCESS_AUDIO_HETZNER_PRODUCTION_HOSTNAME: yt-worker.upperroommedia.org
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate required secrets
        env:
          PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_STAGING || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL_STAGING || secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          SSH_TARGET: ${{ secrets.HETZNER_PROCESS_AUDIO_SSH_TARGET }}
          SSH_KEY: ${{ secrets.HETZNER_PROCESS_AUDIO_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$PROVIDER" ]] || { echo "::error::Missing GCP_WORKLOAD_IDENTITY_PROVIDER_STAGING (or fallback GCP_WORKLOAD_IDENTITY_PROVIDER)"; exit 1; }
          [[ -n "$SERVICE_ACCOUNT" ]] || { echo "::error::Missing GCP_SERVICE_ACCOUNT_EMAIL_STAGING (or fallback GCP_SERVICE_ACCOUNT_EMAIL)"; exit 1; }
          [[ -n "$SSH_TARGET" ]] || { echo "::error::Missing HETZNER_PROCESS_AUDIO_SSH_TARGET"; exit 1; }
          [[ -n "$SSH_KEY" ]] || { echo "::error::Missing HETZNER_PROCESS_AUDIO_SSH_PRIVATE_KEY"; exit 1; }

      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_STAGING || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL_STAGING || secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Set up SSH access for Hetzner
        env:
          SSH_TARGET: ${{ secrets.HETZNER_PROCESS_AUDIO_SSH_TARGET }}
          SSH_KEY: ${{ secrets.HETZNER_PROCESS_AUDIO_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          host_part="${SSH_TARGET##*@}"
          ssh-keyscan -H "$host_part" >> ~/.ssh/known_hosts

      - name: Deploy staging Hetzner worker
        env:
          PROCESS_AUDIO_HETZNER_SSH_TARGET: ${{ secrets.HETZNER_PROCESS_AUDIO_SSH_TARGET }}
        run: ./scripts/deploy-process-audio-hetzner.sh staging

      - name: Verify staging health
        run: bash scripts/wait-for-process-audio-health.sh https://yt-worker-staging.upperroommedia.org/healthz

      - name: Run staging yt-dlp smoke test
        env:
          PROCESS_AUDIO_HETZNER_SSH_TARGET: ${{ secrets.HETZNER_PROCESS_AUDIO_SSH_TARGET }}
        run: bash scripts/verify-hetzner-ytdlp-smoke.sh staging
