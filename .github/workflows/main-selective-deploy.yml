name: main-selective-deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_full_redeploy:
        description: "Deploy all production backend targets regardless of changed files"
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: main-selective-deploy
  cancel-in-progress: true

env:
  FIREBASE_PROJECT: urm-app
  STORAGE_BUCKET: urm-app.appspot.com
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      deploy_web_app: ${{ steps.detect.outputs.deploy_web_app }}
      deploy_firestore: ${{ steps.detect.outputs.deploy_firestore }}
      deploy_database: ${{ steps.detect.outputs.deploy_database }}
      deploy_storage: ${{ steps.detect.outputs.deploy_storage }}
      deploy_functions_core: ${{ steps.detect.outputs.deploy_functions_core }}
      deploy_functions_media: ${{ steps.detect.outputs.deploy_functions_media }}
      deploy_functions_image: ${{ steps.detect.outputs.deploy_functions_image }}
      deploy_functions_integrations: ${{ steps.detect.outputs.deploy_functions_integrations }}
      anything_to_firebase_deploy: ${{ steps.detect.outputs.anything_to_firebase_deploy }}
      anything_to_run: ${{ steps.detect.outputs.anything_to_run }}
      changed_files: ${{ steps.detect.outputs.changed_files }}
      diff_base_sha: ${{ steps.detect.outputs.diff_base_sha }}
      diff_head_sha: ${{ steps.detect.outputs.diff_head_sha }}
      diff_source: ${{ steps.detect.outputs.diff_source }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: detect
        name: Detect deploy targets from changed files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_FILE: main-selective-deploy.yml
          GITHUB_TOKEN: ${{ github.token }}
          FORCE_FULL_REDEPLOY: ${{ github.event.inputs.force_full_redeploy || 'false' }}
        run: |
          set -euo pipefail

          force_full="${FORCE_FULL_REDEPLOY}"
          if [[ "$force_full" != "true" && "$force_full" != "false" ]]; then
            force_full="false"
          fi

          base_sha="$BEFORE_SHA"
          head_sha="$HEAD_SHA"
          diff_source="event.before"

          last_deploy_success_sha=""
          last_deploy_success_run_id=""
          set +e
          successful_runs_json="$(curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/runs?branch=main&status=success&exclude_pull_requests=true&per_page=20" \
          )"
          lookup_status=$?
          set -e
          if [[ "$lookup_status" -ne 0 ]]; then
            echo "::warning::Unable to resolve successful workflow runs. Falling back to event.before."
          fi

          if [[ "$lookup_status" -eq 0 ]]; then
            while IFS='|' read -r run_id run_head_sha; do
              if [[ -z "$run_id" || -z "$run_head_sha" ]]; then
                continue
              fi

              set +e
              run_jobs_json="$(curl -fsSL \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"
              jobs_status=$?
              set -e

              if [[ "$jobs_status" -ne 0 ]]; then
                continue
              fi

              run_had_deploy_step="$(echo "$run_jobs_json" | jq -r '
                [
                  .jobs[]?.steps[]?
                  | select(
                      (
                        .name == "Deploy Firestore rules and indexes"
                        or .name == "Deploy Realtime Database rules"
                        or .name == "Deploy Storage rules"
                        or .name == "Deploy functions:core"
                        or .name == "Deploy functions:media"
                        or .name == "Deploy functions:image"
                        or .name == "Deploy functions:integrations"
                      )
                      and .conclusion == "success"
                    )
                ] | length > 0
              ')"

              if [[ "$run_had_deploy_step" == "true" ]]; then
                last_deploy_success_sha="$run_head_sha"
                last_deploy_success_run_id="$run_id"
                break
              fi
            done < <(echo "$successful_runs_json" | jq -r '.workflow_runs[] | "\(.id)|\(.head_sha)"')
          fi

          if [[ -n "$last_deploy_success_sha" ]] && git cat-file -e "${last_deploy_success_sha}^{commit}" >/dev/null 2>&1; then
            if git merge-base --is-ancestor "$last_deploy_success_sha" "$head_sha"; then
              base_sha="$last_deploy_success_sha"
              diff_source="last_successful_deploy_run:${last_deploy_success_run_id}"
            fi
          fi

          if [[ -z "$base_sha" || "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
            diff_source="bootstrap_fallback"
            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              if git rev-parse "${head_sha}^" >/dev/null 2>&1; then
                base_sha="$(git rev-parse "${head_sha}^")"
                changed_files="$(git diff --name-only "$base_sha" "$head_sha")"
              else
                changed_files="$(git show --name-only --pretty=format: "$head_sha")"
              fi
            else
              changed_files="$(git ls-files)"
            fi
          else
            changed_files="$(git diff --name-only "$base_sha" "$head_sha")"
          fi

          changed_files_for_functions="$(echo "$changed_files" | grep -Ev '^functions/src/sentryBuildInfo\.ts$' || true)"

          contains_path() {
            local pattern="$1"
            if echo "$changed_files" | grep -Eq "$pattern"; then
              return 0
            fi
            return 1
          }

          contains_function_path() {
            local pattern="$1"
            if echo "$changed_files_for_functions" | grep -Eq "$pattern"; then
              return 0
            fi
            return 1
          }

          deploy_firestore=false
          deploy_database=false
          deploy_storage=false
          deploy_web_app=false
          deploy_functions_core=false
          deploy_functions_media=false
          deploy_functions_image=false
          deploy_functions_integrations=false
          if [[ "$force_full" == "true" ]]; then
            deploy_firestore=true
            deploy_database=true
            deploy_storage=true
            deploy_web_app=true
            deploy_functions_core=true
            deploy_functions_media=true
            deploy_functions_image=true
            deploy_functions_integrations=true
          else
            if contains_path '^firestore\.rules$|^firestore\.indexes\.json$'; then
              deploy_firestore=true
            fi

            if contains_path '^database\.rules\.json$'; then
              deploy_database=true
            fi

            if contains_path '^storage\.rules$|^config/storage-cors/production\.json$'; then
              deploy_storage=true
            fi

            if contains_path '^(apps/web/|packages/contracts/|packages/shared/|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.json|turbo\.json|\.npmrc)'; then
              deploy_web_app=true
            fi

            if contains_path '^functions-core/'; then
              deploy_functions_core=true
            fi

            if contains_path '^functions-media/'; then
              deploy_functions_media=true
            fi

            if contains_path '^functions-image/'; then
              deploy_functions_image=true
            fi

            if contains_path '^functions-integrations/'; then
              deploy_functions_integrations=true
            fi

            if contains_function_path '^(functions/src/|apps/web/firebase/|apps/web/shared/|apps/web/types/|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.json|turbo\.json)'; then
              deploy_functions_core=true
              deploy_functions_media=true
              deploy_functions_image=true
              deploy_functions_integrations=true
            fi

            if contains_path '^(packages/contracts/|packages/shared/|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.json|turbo\.json)'; then
              deploy_functions_core=true
              deploy_functions_media=true
              deploy_functions_image=true
              deploy_functions_integrations=true
            fi
          fi

          anything_to_firebase_deploy=false
          if [[ "$deploy_firestore" == "true" || "$deploy_database" == "true" || "$deploy_storage" == "true" || "$deploy_functions_core" == "true" || "$deploy_functions_media" == "true" || "$deploy_functions_image" == "true" || "$deploy_functions_integrations" == "true" ]]; then
            anything_to_firebase_deploy=true
          fi
          anything_to_run="$anything_to_firebase_deploy"

          {
            echo "deploy_firestore=$deploy_firestore"
            echo "deploy_database=$deploy_database"
            echo "deploy_storage=$deploy_storage"
            echo "deploy_web_app=$deploy_web_app"
            echo "deploy_functions_core=$deploy_functions_core"
            echo "deploy_functions_media=$deploy_functions_media"
            echo "deploy_functions_image=$deploy_functions_image"
            echo "deploy_functions_integrations=$deploy_functions_integrations"
            echo "anything_to_firebase_deploy=$anything_to_firebase_deploy"
            echo "anything_to_run=$anything_to_run"
            echo "diff_base_sha=$base_sha"
            echo "diff_head_sha=$head_sha"
            echo "diff_source=$diff_source"
            echo "changed_files<<EOF"
            echo "$changed_files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  plan:
    runs-on: ubuntu-latest
    needs: detect-changes
    steps:
      - name: Publish planned deploy targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_FIRESTORE: ${{ needs.detect-changes.outputs.deploy_firestore }}
          DEPLOY_DATABASE: ${{ needs.detect-changes.outputs.deploy_database }}
          DEPLOY_STORAGE: ${{ needs.detect-changes.outputs.deploy_storage }}
          DEPLOY_WEB_APP: ${{ needs.detect-changes.outputs.deploy_web_app }}
          DEPLOY_FUNCTIONS_CORE: ${{ needs.detect-changes.outputs.deploy_functions_core }}
          DEPLOY_FUNCTIONS_MEDIA: ${{ needs.detect-changes.outputs.deploy_functions_media }}
          DEPLOY_FUNCTIONS_IMAGE: ${{ needs.detect-changes.outputs.deploy_functions_image }}
          DEPLOY_FUNCTIONS_INTEGRATIONS: ${{ needs.detect-changes.outputs.deploy_functions_integrations }}
          ANYTHING_TO_FIREBASE_DEPLOY: ${{ needs.detect-changes.outputs.anything_to_firebase_deploy }}
          ANYTHING_TO_RUN: ${{ needs.detect-changes.outputs.anything_to_run }}
          DIFF_BASE_SHA: ${{ needs.detect-changes.outputs.diff_base_sha }}
          DIFF_HEAD_SHA: ${{ needs.detect-changes.outputs.diff_head_sha }}
          DIFF_SOURCE: ${{ needs.detect-changes.outputs.diff_source }}
          CHANGED_FILES: ${{ needs.detect-changes.outputs.changed_files }}
        run: |
          {
            echo "## Production Selective Deploy"
            echo ""
            echo "- Event: \`$EVENT_NAME\`"
            echo "- Diff source: \`$DIFF_SOURCE\`"
            echo "- Diff range: \`$DIFF_BASE_SHA..$DIFF_HEAD_SHA\`"
            echo "- Firestore rules/indexes: \`$DEPLOY_FIRESTORE\`"
            echo "- Realtime Database rules: \`$DEPLOY_DATABASE\`"
            echo "- Storage rules: \`$DEPLOY_STORAGE\`"
            echo "- Web app release tracking: \`$DEPLOY_WEB_APP\`"
            echo "- Functions core: \`$DEPLOY_FUNCTIONS_CORE\`"
            echo "- Functions media: \`$DEPLOY_FUNCTIONS_MEDIA\`"
            echo "- Functions image: \`$DEPLOY_FUNCTIONS_IMAGE\`"
            echo "- Functions integrations: \`$DEPLOY_FUNCTIONS_INTEGRATIONS\`"
            echo "- Any workflow action needed: \`$ANYTHING_TO_RUN\`"
            echo "- Firebase backend deploy targets: \`$ANYTHING_TO_FIREBASE_DEPLOY\`"
            echo ""
            echo "### Changed Files"
            echo '\`\`\`'
            if [[ -n "$CHANGED_FILES" ]]; then
              echo "$CHANGED_FILES"
            else
              echo "<none>"
            fi
            echo '\`\`\`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: No-op for non-deployable changes
        if: needs.detect-changes.outputs.anything_to_run != 'true'
        run: echo "No deployable changes detected for production."

  track-web-release:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.deploy_web_app == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create production Sentry release for web-app
        if: ${{ env.SENTRY_AUTH_TOKEN != '' }}
        uses: getsentry/action-release@v3
        env:
          SENTRY_ORG: upper-room-media
        with:
          projects: web-app
          environment: production
          release: web-app@production-${{ github.sha }}
          set_commits: auto
          ignore_missing: true
          ignore_empty: true
          working_directory: .

  deploy-firestore:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: detect-changes
    if: needs.detect-changes.outputs.deploy_firestore == 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-backend-deploy
        with:
          gcp_project: ${{ env.FIREBASE_PROJECT }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_PRODUCTION || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL_PRODUCTION || secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Deploy Firestore rules and indexes
        run: pnpm exec firebase deploy --project "$FIREBASE_PROJECT" --only firestore:rules,firestore:indexes --non-interactive

  deploy-database:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: detect-changes
    if: needs.detect-changes.outputs.deploy_database == 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-backend-deploy
        with:
          gcp_project: ${{ env.FIREBASE_PROJECT }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_PRODUCTION || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL_PRODUCTION || secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Deploy Realtime Database rules
        run: pnpm exec firebase deploy --project "$FIREBASE_PROJECT" --only database:rtdb --non-interactive

  deploy-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: detect-changes
    if: needs.detect-changes.outputs.deploy_storage == 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-backend-deploy
        with:
          gcp_project: ${{ env.FIREBASE_PROJECT }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_PRODUCTION || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL_PRODUCTION || secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Deploy Storage rules
        run: pnpm exec firebase deploy --project "$FIREBASE_PROJECT" --only storage --non-interactive

      - name: Apply Storage bucket CORS
        run: gcloud storage buckets update "gs://$STORAGE_BUCKET" --cors-file=config/storage-cors/production.json

  deploy-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: detect-changes
    if: needs.detect-changes.outputs.deploy_functions_core == 'true' || needs.detect-changes.outputs.deploy_functions_media == 'true' || needs.detect-changes.outputs.deploy_functions_image == 'true' || needs.detect-changes.outputs.deploy_functions_integrations == 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-backend-deploy
        with:
          gcp_project: ${{ env.FIREBASE_PROJECT }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_PRODUCTION || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL_PRODUCTION || secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          materialize_catalog: 'true'

      - name: Deploy functions:core
        if: needs.detect-changes.outputs.deploy_functions_core == 'true'
        run: ./scripts/firebase-deploy-with-quota-retry.sh deploy --project "$FIREBASE_PROJECT" --only functions:core --non-interactive

      - name: Remove retired media function
        if: needs.detect-changes.outputs.deploy_functions_media == 'true'
        run: |
          pnpm exec firebase functions:delete addintrooutrotaskhandler \
            --project "$FIREBASE_PROJECT" \
            --region us-central1 \
            --force >/dev/null 2>&1 || true

      - name: Deploy functions:media
        if: needs.detect-changes.outputs.deploy_functions_media == 'true'
        run: ./scripts/firebase-deploy-with-quota-retry.sh deploy --project "$FIREBASE_PROJECT" --only functions:media --non-interactive

      - name: Deploy functions:image
        if: needs.detect-changes.outputs.deploy_functions_image == 'true'
        run: ./scripts/firebase-deploy-with-quota-retry.sh deploy --project "$FIREBASE_PROJECT" --only functions:image --non-interactive

      - name: Deploy functions:integrations
        if: needs.detect-changes.outputs.deploy_functions_integrations == 'true'
        run: ./scripts/firebase-deploy-with-quota-retry.sh deploy --project "$FIREBASE_PROJECT" --only functions:integrations --non-interactive

  track-functions-release:
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - deploy-functions
    if: (needs.detect-changes.outputs.deploy_functions_core == 'true' || needs.detect-changes.outputs.deploy_functions_media == 'true' || needs.detect-changes.outputs.deploy_functions_image == 'true' || needs.detect-changes.outputs.deploy_functions_integrations == 'true') && needs.deploy-functions.result == 'success'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create production Sentry release for firebase-functions
        if: ${{ env.SENTRY_AUTH_TOKEN != '' }}
        uses: getsentry/action-release@v3
        env:
          SENTRY_ORG: upper-room-media
        with:
          projects: firebase-functions
          environment: production
          release: firebase-functions@production-${{ github.sha }}
          set_commits: auto
          ignore_missing: true
          ignore_empty: true
          working_directory: .
