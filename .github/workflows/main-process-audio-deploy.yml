name: main-process-audio-deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_process_audio_redeploy:
        description: "Deploy production process-audio regardless of changed files"
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: main-process-audio-deploy
  cancel-in-progress: true

env:
  GCP_PROJECT: urm-app

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      deploy_browser_fallback: ${{ steps.detect.outputs.deploy_browser_fallback }}
      deploy_process_audio: ${{ steps.detect.outputs.deploy_process_audio }}
      anything_to_run: ${{ steps.detect.outputs.anything_to_run }}
      changed_files: ${{ steps.detect.outputs.changed_files }}
      diff_base_sha: ${{ steps.detect.outputs.diff_base_sha }}
      diff_head_sha: ${{ steps.detect.outputs.diff_head_sha }}
      diff_source: ${{ steps.detect.outputs.diff_source }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: detect
        name: Detect process-audio deploy changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_FILE: main-process-audio-deploy.yml
          GITHUB_TOKEN: ${{ github.token }}
          FORCE_PROCESS_AUDIO_REDEPLOY: ${{ github.event.inputs.force_process_audio_redeploy || 'false' }}
        run: |
          set -euo pipefail

          force_redeploy="${FORCE_PROCESS_AUDIO_REDEPLOY}"
          if [[ "$force_redeploy" != "true" && "$force_redeploy" != "false" ]]; then
            force_redeploy="false"
          fi

          base_sha="$BEFORE_SHA"
          head_sha="$HEAD_SHA"
          diff_source="event.before"

          last_deploy_success_sha=""
          last_deploy_success_run_id=""
          set +e
          successful_runs_json="$(curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/runs?branch=main&status=success&exclude_pull_requests=true&per_page=20" \
          )"
          lookup_status=$?
          set -e
          if [[ "$lookup_status" -ne 0 ]]; then
            echo "::warning::Unable to resolve successful workflow runs. Falling back to event.before."
          fi

          if [[ "$lookup_status" -eq 0 ]]; then
            while IFS='|' read -r run_id run_head_sha; do
              if [[ -z "$run_id" || -z "$run_head_sha" ]]; then
                continue
              fi

              set +e
              run_jobs_json="$(curl -fsSL \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"
              jobs_status=$?
              set -e

              if [[ "$jobs_status" -ne 0 ]]; then
                continue
              fi

              run_had_deploy_step="$(echo "$run_jobs_json" | jq -r '
                [
                  .jobs[]?.steps[]?
                  | select(.name == "Deploy production process-audio Cloud Run" and .conclusion == "success")
                ] | length > 0
              ')"

              if [[ "$run_had_deploy_step" == "true" ]]; then
                last_deploy_success_sha="$run_head_sha"
                last_deploy_success_run_id="$run_id"
                break
              fi
            done < <(echo "$successful_runs_json" | jq -r '.workflow_runs[] | "\(.id)|\(.head_sha)"')
          fi

          if [[ -n "$last_deploy_success_sha" ]] && git cat-file -e "${last_deploy_success_sha}^{commit}" >/dev/null 2>&1; then
            if git merge-base --is-ancestor "$last_deploy_success_sha" "$head_sha"; then
              base_sha="$last_deploy_success_sha"
              diff_source="last_successful_deploy_run:${last_deploy_success_run_id}"
            fi
          fi

          if [[ -z "$base_sha" || "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
            diff_source="bootstrap_fallback"
            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              if git rev-parse "${head_sha}^" >/dev/null 2>&1; then
                base_sha="$(git rev-parse "${head_sha}^")"
                changed_files="$(git diff --name-only "$base_sha" "$head_sha")"
              else
                changed_files="$(git show --name-only --pretty=format: "$head_sha")"
              fi
            else
              changed_files="$(git ls-files)"
            fi
          else
            changed_files="$(git diff --name-only "$base_sha" "$head_sha")"
          fi

          contains_path() {
            local pattern="$1"
            if echo "$changed_files" | grep -Eq "$pattern"; then
              return 0
            fi
            return 1
          }

          deploy_browser_fallback=false
          deploy_process_audio=false
          if [[ "$force_redeploy" == "true" ]]; then
            deploy_process_audio=true
          else
            if contains_path '^apps/browser-fallback/|^apps/browser-fallback-cloudflare/'; then
              deploy_browser_fallback=true
            fi

            if contains_path '^apps/process-audio/'; then
              deploy_process_audio=true
            fi

            if contains_path '^(\.github/workflows/main-process-audio-deploy\.yml|packages/contracts/|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.json|turbo\.json|\.npmrc|wrangler\.browser-fallback\.jsonc|Dockerfile\.browser-fallback-cloudflare|scripts/deploy-browser-fallback\.sh|scripts/deploy-cloudflare-browser-fallback\.sh|scripts/ensure-private-cloud-run-invoker\.sh|scripts/ensure-service-account-self-token-creator\.sh|scripts/ensure-browser-fallback-static-egress\.sh|scripts/set-browser-fallback-runtime-config\.mjs|scripts/set-browser-fallback-runtime-config\.sh)'; then
              deploy_browser_fallback=true
            fi

            if contains_path '^(\.github/workflows/main-process-audio-deploy\.yml|packages/contracts/|packages/shared/|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.json|turbo\.json|\.npmrc|scripts/deploy-process-audio\.sh|scripts/ensure-public-cloud-run-invoker\.sh)'; then
              deploy_process_audio=true
            fi
          fi

          anything_to_run=false
          if [[ "$deploy_browser_fallback" == "true" || "$deploy_process_audio" == "true" ]]; then
            anything_to_run=true
          fi

          {
            echo "deploy_browser_fallback=$deploy_browser_fallback"
            echo "deploy_process_audio=$deploy_process_audio"
            echo "anything_to_run=$anything_to_run"
            echo "diff_base_sha=$base_sha"
            echo "diff_head_sha=$head_sha"
            echo "diff_source=$diff_source"
            echo "changed_files<<EOF"
            echo "$changed_files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  deploy-or-skip:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: detect-changes
    steps:
      - name: Publish planned deploy targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_BROWSER_FALLBACK: ${{ needs.detect-changes.outputs.deploy_browser_fallback }}
          DEPLOY_PROCESS_AUDIO: ${{ needs.detect-changes.outputs.deploy_process_audio }}
          ANYTHING_TO_RUN: ${{ needs.detect-changes.outputs.anything_to_run }}
          DIFF_BASE_SHA: ${{ needs.detect-changes.outputs.diff_base_sha }}
          DIFF_HEAD_SHA: ${{ needs.detect-changes.outputs.diff_head_sha }}
          DIFF_SOURCE: ${{ needs.detect-changes.outputs.diff_source }}
          CHANGED_FILES: ${{ needs.detect-changes.outputs.changed_files }}
        run: |
          {
            echo "## Production Process Audio Deploy"
            echo ""
            echo "- Event: \`$EVENT_NAME\`"
            echo "- Diff source: \`$DIFF_SOURCE\`"
            echo "- Diff range: \`$DIFF_BASE_SHA..$DIFF_HEAD_SHA\`"
            echo "- Browser fallback Cloud Run: \`$DEPLOY_BROWSER_FALLBACK\`"
            echo "- Process audio Cloud Run: \`$DEPLOY_PROCESS_AUDIO\`"
            echo "- Any workflow action needed: \`$ANYTHING_TO_RUN\`"
            echo ""
            echo "### Changed Files"
            echo '\`\`\`'
            if [[ -n "$CHANGED_FILES" ]]; then
              echo "$CHANGED_FILES"
            else
              echo "<none>"
            fi
            echo '\`\`\`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        if: needs.detect-changes.outputs.anything_to_run == 'true'
        uses: actions/checkout@v5

      - name: Validate GCP OIDC secrets
        if: needs.detect-changes.outputs.anything_to_run == 'true'
        env:
          PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
        run: |
          set -euo pipefail
          if [[ -z "$PROVIDER" ]]; then
            echo "::error::Missing secret GCP_WORKLOAD_IDENTITY_PROVIDER"
            exit 1
          fi
          if [[ -z "$SERVICE_ACCOUNT" ]]; then
            echo "::error::Missing secret GCP_SERVICE_ACCOUNT_EMAIL"
            exit 1
          fi

      - name: Authenticate to Google Cloud (OIDC)
        if: needs.detect-changes.outputs.anything_to_run == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up gcloud
        if: needs.detect-changes.outputs.anything_to_run == 'true'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Deploy production process-audio Cloud Run
        if: needs.detect-changes.outputs.anything_to_run == 'true'
        env:
          GITHUB_SHA: ${{ github.sha }}
          DEPLOY_BROWSER_FALLBACK: ${{ needs.detect-changes.outputs.deploy_browser_fallback }}
          DEPLOY_PROCESS_AUDIO: ${{ needs.detect-changes.outputs.deploy_process_audio }}
          EXTERNAL_BROWSER_FALLBACK_SERVICE_URL: ${{ secrets.PRODUCTION_BROWSER_FALLBACK_SERVICE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 465e1a48ef2e28a1f4227860735e84d5
        run: |
          set -euo pipefail
          project_number="$(gcloud projects describe "${GCP_PROJECT}" --format='value(projectNumber)')"
          process_audio_runtime_sa="${project_number}-compute@developer.gserviceaccount.com"
          browser_fallback_service_url=""
          external_browser_fallback_service_url="${EXTERNAL_BROWSER_FALLBACK_SERVICE_URL:-}"
          external_browser_fallback_service_url="${external_browser_fallback_service_url%/}"

          if [[ -n "${external_browser_fallback_service_url}" && "${DEPLOY_BROWSER_FALLBACK}" == 'true' && -n "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            bash scripts/deploy-cloudflare-browser-fallback.sh production "${GCP_PROJECT}"
            browser_fallback_service_url="${external_browser_fallback_service_url}"
            echo "Using hosted production Cloudflare browser fallback URL: ${browser_fallback_service_url}"
          elif [[ -n "${external_browser_fallback_service_url}" ]]; then
            browser_fallback_service_url="${external_browser_fallback_service_url}"
            echo "Using external production browser fallback URL override: ${browser_fallback_service_url}"
            if [[ "${DEPLOY_BROWSER_FALLBACK}" == 'true' && -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
              echo "::warning::Skipping Cloudflare browser fallback deploy because CLOUDFLARE_API_TOKEN is not configured."
            fi
          elif [[ "${DEPLOY_BROWSER_FALLBACK}" == 'true' ]]; then
            bash scripts/ensure-browser-fallback-static-egress.sh "${GCP_PROJECT}" us-central1 default default
            bash scripts/deploy-browser-fallback.sh production "$GITHUB_SHA"
            bash scripts/ensure-service-account-self-token-creator.sh "${GCP_PROJECT}" "${process_audio_runtime_sa}"
            bash scripts/ensure-private-cloud-run-invoker.sh "${GCP_PROJECT}" us-central1 browser-fallback "${process_audio_runtime_sa}"
            browser_fallback_service_url="$(gcloud run services describe browser-fallback --project "${GCP_PROJECT}" --region us-central1 --format='value(status.url)')"
          else
            browser_fallback_service_url="$(gcloud run services describe browser-fallback --project "${GCP_PROJECT}" --region us-central1 --format='value(status.url)' 2>/dev/null || true)"
          fi

          bash scripts/set-browser-fallback-runtime-config.sh "${GCP_PROJECT}" "https://urm-app-default-rtdb.firebaseio.com/" "${browser_fallback_service_url}" true

          if [[ "${DEPLOY_PROCESS_AUDIO}" == 'true' ]]; then
            BROWSER_FALLBACK_SERVICE_URL="${browser_fallback_service_url}" bash scripts/deploy-process-audio.sh production "$GITHUB_SHA"
          else
            echo "Skipping process-audio Cloud Run deploy; no relevant changes detected."
          fi

      - name: Ensure production POT provider public invoker
        if: needs.detect-changes.outputs.deploy_process_audio == 'true'
        run: bash scripts/ensure-public-cloud-run-invoker.sh "${GCP_PROJECT}" us-central1 ytdlp-pot-provider

      - name: No-op for non-deployable changes
        if: needs.detect-changes.outputs.anything_to_run != 'true'
        run: echo "No deployable process-audio changes detected for production."
