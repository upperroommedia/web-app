name: staging-selective-deploy

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      force_full_redeploy:
        description: "Deploy all staging targets regardless of changed files"
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: staging-selective-deploy
  cancel-in-progress: true

env:
  FIREBASE_PROJECT: urm-app-staging

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      deploy_firestore: ${{ steps.detect.outputs.deploy_firestore }}
      deploy_database: ${{ steps.detect.outputs.deploy_database }}
      deploy_storage: ${{ steps.detect.outputs.deploy_storage }}
      deploy_functions_core: ${{ steps.detect.outputs.deploy_functions_core }}
      deploy_functions_media: ${{ steps.detect.outputs.deploy_functions_media }}
      deploy_functions_image: ${{ steps.detect.outputs.deploy_functions_image }}
      deploy_functions_integrations: ${{ steps.detect.outputs.deploy_functions_integrations }}
      anything_to_run: ${{ steps.detect.outputs.anything_to_run }}
      anything_to_deploy: ${{ steps.detect.outputs.anything_to_deploy }}
      changed_files: ${{ steps.detect.outputs.changed_files }}
      diff_base_sha: ${{ steps.detect.outputs.diff_base_sha }}
      diff_head_sha: ${{ steps.detect.outputs.diff_head_sha }}
      diff_source: ${{ steps.detect.outputs.diff_source }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: detect
        name: Detect deploy targets from changed files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_FILE: staging-selective-deploy.yml
          GITHUB_TOKEN: ${{ github.token }}
          FORCE_FULL_REDEPLOY: ${{ github.event.inputs.force_full_redeploy || 'false' }}
        run: |
          set -euo pipefail

          force_full="${FORCE_FULL_REDEPLOY}"
          if [[ "$force_full" != "true" && "$force_full" != "false" ]]; then
            force_full="false"
          fi

          base_sha="$BEFORE_SHA"
          head_sha="$HEAD_SHA"
          diff_source="event.before"

          last_deploy_success_sha=""
          last_deploy_success_run_id=""
          set +e
          successful_runs_json="$(curl -fsSL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/runs?branch=staging&status=success&exclude_pull_requests=true&per_page=20" \
          )"
          lookup_status=$?
          set -e
          if [[ "$lookup_status" -ne 0 ]]; then
            echo "::warning::Unable to resolve successful workflow runs. Falling back to event.before."
          fi

          if [[ "$lookup_status" -eq 0 ]]; then
            while IFS='|' read -r run_id run_head_sha; do
              if [[ -z "$run_id" || -z "$run_head_sha" ]]; then
                continue
              fi

              set +e
              run_jobs_json="$(curl -fsSL \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"
              jobs_status=$?
              set -e

              if [[ "$jobs_status" -ne 0 ]]; then
                continue
              fi

              run_had_deploy_step="$(echo "$run_jobs_json" | jq -r '
                [
                  .jobs[]?.steps[]?
                  | select(
                      (.name == "Deploy selected staging targets")
                      and .conclusion == "success"
                    )
                ] | length > 0
              ')"

              if [[ "$run_had_deploy_step" == "true" ]]; then
                last_deploy_success_sha="$run_head_sha"
                last_deploy_success_run_id="$run_id"
                break
              fi
            done < <(echo "$successful_runs_json" | jq -r '.workflow_runs[] | "\(.id)|\(.head_sha)"')
          fi

          if [[ -n "$last_deploy_success_sha" ]] && git cat-file -e "${last_deploy_success_sha}^{commit}" >/dev/null 2>&1; then
            if git merge-base --is-ancestor "$last_deploy_success_sha" "$head_sha"; then
              base_sha="$last_deploy_success_sha"
              diff_source="last_successful_deploy_run:${last_deploy_success_run_id}"
            fi
          fi

          if [[ -z "$base_sha" || "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
            diff_source="bootstrap_fallback"
            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              if git rev-parse "${head_sha}^" >/dev/null 2>&1; then
                base_sha="$(git rev-parse "${head_sha}^")"
                changed_files="$(git diff --name-only "$base_sha" "$head_sha")"
              else
                changed_files="$(git show --name-only --pretty=format: "$head_sha")"
              fi
            else
              changed_files="$(git ls-files)"
            fi
          else
            changed_files="$(git diff --name-only "$base_sha" "$head_sha")"
          fi

          contains_path() {
            local pattern="$1"
            if echo "$changed_files" | grep -Eq "$pattern"; then
              return 0
            fi
            return 1
          }

          deploy_firestore=false
          deploy_database=false
          deploy_storage=false
          deploy_functions_core=false
          deploy_functions_media=false
          deploy_functions_image=false
          deploy_functions_integrations=false

          if [[ "$force_full" == "true" ]]; then
            deploy_firestore=true
            deploy_database=true
            deploy_storage=true
            deploy_functions_core=true
            deploy_functions_media=true
            deploy_functions_image=true
            deploy_functions_integrations=true
          else
            if contains_path '^firestore\.rules$|^firestore\.indexes\.json$'; then
              deploy_firestore=true
            fi

            if contains_path '^database\.rules\.json$'; then
              deploy_database=true
            fi

            if contains_path '^storage\.rules$'; then
              deploy_storage=true
            fi

            if contains_path '^functions-core/'; then
              deploy_functions_core=true
            fi

            if contains_path '^functions-media/'; then
              deploy_functions_media=true
            fi

            if contains_path '^functions-image/'; then
              deploy_functions_image=true
            fi

            if contains_path '^functions-integrations/'; then
              deploy_functions_integrations=true
            fi

            if contains_path '^(functions/src/|firebase/firebaseAdmin\.ts|shared/|types/|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.json|turbo\.json)'; then
              deploy_functions_core=true
              deploy_functions_media=true
              deploy_functions_image=true
              deploy_functions_integrations=true
            fi
          fi

          anything_to_deploy=false
          anything_to_run=false
          if [[ "$deploy_firestore" == "true" || "$deploy_database" == "true" || "$deploy_storage" == "true" || "$deploy_functions_core" == "true" || "$deploy_functions_media" == "true" || "$deploy_functions_image" == "true" || "$deploy_functions_integrations" == "true" ]]; then
            anything_to_deploy=true
          fi
          if [[ "$anything_to_deploy" == "true" ]]; then
            anything_to_run=true
          fi

          {
            echo "deploy_firestore=$deploy_firestore"
            echo "deploy_database=$deploy_database"
            echo "deploy_storage=$deploy_storage"
            echo "deploy_functions_core=$deploy_functions_core"
            echo "deploy_functions_media=$deploy_functions_media"
            echo "deploy_functions_image=$deploy_functions_image"
            echo "deploy_functions_integrations=$deploy_functions_integrations"
            echo "anything_to_run=$anything_to_run"
            echo "anything_to_deploy=$anything_to_deploy"
            echo "diff_base_sha=$base_sha"
            echo "diff_head_sha=$head_sha"
            echo "diff_source=$diff_source"
            echo "changed_files<<EOF"
            echo "$changed_files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  deploy-or-skip:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: detect-changes
    steps:
      - name: Publish planned deploy targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_FIRESTORE: ${{ needs.detect-changes.outputs.deploy_firestore }}
          DEPLOY_DATABASE: ${{ needs.detect-changes.outputs.deploy_database }}
          DEPLOY_STORAGE: ${{ needs.detect-changes.outputs.deploy_storage }}
          DEPLOY_FUNCTIONS_CORE: ${{ needs.detect-changes.outputs.deploy_functions_core }}
          DEPLOY_FUNCTIONS_MEDIA: ${{ needs.detect-changes.outputs.deploy_functions_media }}
          DEPLOY_FUNCTIONS_IMAGE: ${{ needs.detect-changes.outputs.deploy_functions_image }}
          DEPLOY_FUNCTIONS_INTEGRATIONS: ${{ needs.detect-changes.outputs.deploy_functions_integrations }}
          ANYTHING_TO_RUN: ${{ needs.detect-changes.outputs.anything_to_run }}
          ANYTHING_TO_DEPLOY: ${{ needs.detect-changes.outputs.anything_to_deploy }}
          DIFF_BASE_SHA: ${{ needs.detect-changes.outputs.diff_base_sha }}
          DIFF_HEAD_SHA: ${{ needs.detect-changes.outputs.diff_head_sha }}
          DIFF_SOURCE: ${{ needs.detect-changes.outputs.diff_source }}
          CHANGED_FILES: ${{ needs.detect-changes.outputs.changed_files }}
        run: |
          {
            echo "## Staging Selective Deploy"
            echo ""
            echo "- Event: \`$EVENT_NAME\`"
            echo "- Diff source: \`$DIFF_SOURCE\`"
            echo "- Diff range: \`$DIFF_BASE_SHA..$DIFF_HEAD_SHA\`"
            echo "- Firestore rules/indexes: \`$DEPLOY_FIRESTORE\`"
            echo "- Realtime Database rules: \`$DEPLOY_DATABASE\`"
            echo "- Storage rules: \`$DEPLOY_STORAGE\`"
            echo "- Functions core: \`$DEPLOY_FUNCTIONS_CORE\`"
            echo "- Functions media: \`$DEPLOY_FUNCTIONS_MEDIA\`"
            echo "- Functions image: \`$DEPLOY_FUNCTIONS_IMAGE\`"
            echo "- Functions integrations: \`$DEPLOY_FUNCTIONS_INTEGRATIONS\`"
            echo "- Any workflow action needed: \`$ANYTHING_TO_RUN\`"
            echo "- Firebase backend deploy targets: \`$ANYTHING_TO_DEPLOY\`"
            echo ""
            echo "### Changed Files"
            echo '\`\`\`'
            if [[ -n "$CHANGED_FILES" ]]; then
              echo "$CHANGED_FILES"
            else
              echo "<none>"
            fi
            echo '\`\`\`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        if: needs.detect-changes.outputs.anything_to_run == 'true'
        uses: actions/checkout@v5

      - name: Validate GCP OIDC secrets
        if: needs.detect-changes.outputs.anything_to_run == 'true'
        env:
          PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
        run: |
          set -euo pipefail
          if [[ -z "$PROVIDER" ]]; then
            echo "::error::Missing secret GCP_WORKLOAD_IDENTITY_PROVIDER"
            exit 1
          fi
          if [[ -z "$SERVICE_ACCOUNT" ]]; then
            echo "::error::Missing secret GCP_SERVICE_ACCOUNT_EMAIL"
            exit 1
          fi

      - name: Authenticate to Google Cloud (OIDC)
        if: needs.detect-changes.outputs.anything_to_run == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up Node.js
        if: needs.detect-changes.outputs.anything_to_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        if: needs.detect-changes.outputs.anything_to_run == 'true'
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        if: needs.detect-changes.outputs.anything_to_run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Materialize catalog dependencies for Firebase deploy
        if: needs.detect-changes.outputs.anything_to_deploy == 'true'
        run: node scripts/materialize-catalog-for-firebase.mjs

      - name: Deploy selected staging targets
        if: needs.detect-changes.outputs.anything_to_deploy == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_FIRESTORE: ${{ needs.detect-changes.outputs.deploy_firestore }}
          DEPLOY_DATABASE: ${{ needs.detect-changes.outputs.deploy_database }}
          DEPLOY_STORAGE: ${{ needs.detect-changes.outputs.deploy_storage }}
          DEPLOY_FUNCTIONS_CORE: ${{ needs.detect-changes.outputs.deploy_functions_core }}
          DEPLOY_FUNCTIONS_MEDIA: ${{ needs.detect-changes.outputs.deploy_functions_media }}
          DEPLOY_FUNCTIONS_IMAGE: ${{ needs.detect-changes.outputs.deploy_functions_image }}
          DEPLOY_FUNCTIONS_INTEGRATIONS: ${{ needs.detect-changes.outputs.deploy_functions_integrations }}
        run: |
          set -euo pipefail

          deployed_targets=()
          failed_targets=()

          run_function_deploy() {
            local codebase="$1"
            local log_file="$2"
            local __pid_var="$3"
            (
              set -euo pipefail
              pnpm exec firebase deploy --project "$FIREBASE_PROJECT" --only "$codebase" --non-interactive
            ) >"$log_file" 2>&1 &
            printf -v "$__pid_var" '%s' "$!"
          }

          if [[ "$DEPLOY_FIRESTORE" == "true" ]]; then
            pnpm exec firebase deploy --project "$FIREBASE_PROJECT" --only firestore:rules,firestore:indexes --non-interactive
            deployed_targets+=("firestore:rules")
            deployed_targets+=("firestore:indexes")
          fi

          if [[ "$DEPLOY_DATABASE" == "true" ]]; then
            pnpm exec firebase deploy --project "$FIREBASE_PROJECT" --only database:rtdb --non-interactive
            deployed_targets+=("database:rtdb")
          fi

          if [[ "$DEPLOY_STORAGE" == "true" ]]; then
            pnpm exec firebase deploy --project "$FIREBASE_PROJECT" --only storage --non-interactive
            deployed_targets+=("storage")
          fi

          function_names=()
          function_pids=()
          function_logs=()

          if [[ "$DEPLOY_FUNCTIONS_CORE" == "true" ]]; then
            function_names+=("functions:core")
            log_file="$(mktemp)"
            function_logs+=("$log_file")
            run_function_deploy "functions:core" "$log_file" pid
            function_pids+=("$pid")
          fi

          if [[ "$DEPLOY_FUNCTIONS_MEDIA" == "true" ]]; then
            function_names+=("functions:media")
            log_file="$(mktemp)"
            function_logs+=("$log_file")
            run_function_deploy "functions:media" "$log_file" pid
            function_pids+=("$pid")
          fi

          if [[ "$DEPLOY_FUNCTIONS_IMAGE" == "true" ]]; then
            function_names+=("functions:image")
            log_file="$(mktemp)"
            function_logs+=("$log_file")
            run_function_deploy "functions:image" "$log_file" pid
            function_pids+=("$pid")
          fi

          if [[ "$DEPLOY_FUNCTIONS_INTEGRATIONS" == "true" ]]; then
            function_names+=("functions:integrations")
            log_file="$(mktemp)"
            function_logs+=("$log_file")
            run_function_deploy "functions:integrations" "$log_file" pid
            function_pids+=("$pid")
          fi

          for i in "${!function_pids[@]}"; do
            name="${function_names[$i]}"
            pid="${function_pids[$i]}"
            log_file="${function_logs[$i]}"

            if wait "$pid"; then
              deployed_targets+=("$name")
              cat "$log_file"
            else
              failed_targets+=("$name")
              echo "::error::Deploy failed for $name"
              cat "$log_file"
            fi
            rm -f "$log_file"
          done

          if [[ "${#failed_targets[@]}" -gt 0 ]]; then
            echo "::error::Failed backend deploy targets: ${failed_targets[*]}"
            exit 1
          fi

          {
            echo "### Deployed Targets"
            echo ""
            if [[ "${#deployed_targets[@]}" -eq 0 ]]; then
              echo "No targets deployed."
            else
              for target in "${deployed_targets[@]}"; do
                printf '%s\n' "- \`$target\`"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: No-op for non-deployable changes
        if: needs.detect-changes.outputs.anything_to_run != 'true'
        run: echo "No deployable changes detected for staging."
