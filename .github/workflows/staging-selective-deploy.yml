name: staging-selective-deploy

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      force_full_redeploy:
        description: "Deploy all staging targets regardless of changed files"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: staging-selective-deploy
  cancel-in-progress: true

env:
  FIREBASE_PROJECT: urm-app-staging

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      deploy_apphosting: ${{ steps.detect.outputs.deploy_apphosting }}
      deploy_firestore: ${{ steps.detect.outputs.deploy_firestore }}
      deploy_database: ${{ steps.detect.outputs.deploy_database }}
      deploy_storage: ${{ steps.detect.outputs.deploy_storage }}
      deploy_functions_core: ${{ steps.detect.outputs.deploy_functions_core }}
      deploy_functions_media: ${{ steps.detect.outputs.deploy_functions_media }}
      deploy_functions_image: ${{ steps.detect.outputs.deploy_functions_image }}
      deploy_functions_integrations: ${{ steps.detect.outputs.deploy_functions_integrations }}
      anything_to_deploy: ${{ steps.detect.outputs.anything_to_deploy }}
      changed_files: ${{ steps.detect.outputs.changed_files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        name: Detect deploy targets from changed files
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          FORCE_FULL_REDEPLOY: ${{ github.event.inputs.force_full_redeploy || 'false' }}
        run: |
          set -euo pipefail

          force_full="${FORCE_FULL_REDEPLOY}"
          if [[ "$force_full" != "true" && "$force_full" != "false" ]]; then
            force_full="false"
          fi

          base_sha="$BEFORE_SHA"
          head_sha="$HEAD_SHA"

          if [[ -z "$base_sha" || "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
            changed_files="$(git ls-files)"
          else
            changed_files="$(git diff --name-only "$base_sha" "$head_sha")"
          fi

          contains_path() {
            local pattern="$1"
            if echo "$changed_files" | grep -Eq "$pattern"; then
              return 0
            fi
            return 1
          }

          deploy_apphosting=false
          deploy_firestore=false
          deploy_database=false
          deploy_storage=false
          deploy_functions_core=false
          deploy_functions_media=false
          deploy_functions_image=false
          deploy_functions_integrations=false

          if [[ "$force_full" == "true" ]]; then
            deploy_apphosting=true
            deploy_firestore=true
            deploy_database=true
            deploy_storage=true
            deploy_functions_core=true
            deploy_functions_media=true
            deploy_functions_image=true
            deploy_functions_integrations=true
          else
            if contains_path '^(apphosting\.staging\.yaml|apphosting\.yaml|firebase\.json|next\.config\.js|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json|tsconfig\.json|playwright\.config\.ts|components/|pages/|public/|styles/|layout/|context/|hooks/|reducers/|constants/|utils/|extensions/|firebase/|shared/|scripts/|docs/)'; then
              deploy_apphosting=true
            fi

            if contains_path '^firestore\.rules$|^firestore\.indexes\.json$'; then
              deploy_firestore=true
            fi

            if contains_path '^database\.rules\.json$'; then
              deploy_database=true
            fi

            if contains_path '^storage\.rules$'; then
              deploy_storage=true
            fi

            if contains_path '^functions-core/'; then
              deploy_functions_core=true
            fi

            if contains_path '^functions-media/'; then
              deploy_functions_media=true
            fi

            if contains_path '^functions-image/'; then
              deploy_functions_image=true
            fi

            if contains_path '^functions-integrations/'; then
              deploy_functions_integrations=true
            fi

            if contains_path '^(functions/src/|firebase/firebaseAdmin\.ts|shared/|types/|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.json|turbo\.json)'; then
              deploy_functions_core=true
              deploy_functions_media=true
              deploy_functions_image=true
              deploy_functions_integrations=true
            fi
          fi

          anything_to_deploy=false
          if [[ "$deploy_apphosting" == "true" || "$deploy_firestore" == "true" || "$deploy_database" == "true" || "$deploy_storage" == "true" || "$deploy_functions_core" == "true" || "$deploy_functions_media" == "true" || "$deploy_functions_image" == "true" || "$deploy_functions_integrations" == "true" ]]; then
            anything_to_deploy=true
          fi

          {
            echo "deploy_apphosting=$deploy_apphosting"
            echo "deploy_firestore=$deploy_firestore"
            echo "deploy_database=$deploy_database"
            echo "deploy_storage=$deploy_storage"
            echo "deploy_functions_core=$deploy_functions_core"
            echo "deploy_functions_media=$deploy_functions_media"
            echo "deploy_functions_image=$deploy_functions_image"
            echo "deploy_functions_integrations=$deploy_functions_integrations"
            echo "anything_to_deploy=$anything_to_deploy"
            echo "changed_files<<EOF"
            echo "$changed_files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  deploy-or-skip:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: detect-changes
    steps:
      - name: Publish planned deploy targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_APPHOSTING: ${{ needs.detect-changes.outputs.deploy_apphosting }}
          DEPLOY_FIRESTORE: ${{ needs.detect-changes.outputs.deploy_firestore }}
          DEPLOY_DATABASE: ${{ needs.detect-changes.outputs.deploy_database }}
          DEPLOY_STORAGE: ${{ needs.detect-changes.outputs.deploy_storage }}
          DEPLOY_FUNCTIONS_CORE: ${{ needs.detect-changes.outputs.deploy_functions_core }}
          DEPLOY_FUNCTIONS_MEDIA: ${{ needs.detect-changes.outputs.deploy_functions_media }}
          DEPLOY_FUNCTIONS_IMAGE: ${{ needs.detect-changes.outputs.deploy_functions_image }}
          DEPLOY_FUNCTIONS_INTEGRATIONS: ${{ needs.detect-changes.outputs.deploy_functions_integrations }}
          ANYTHING_TO_DEPLOY: ${{ needs.detect-changes.outputs.anything_to_deploy }}
          CHANGED_FILES: ${{ needs.detect-changes.outputs.changed_files }}
        run: |
          {
            echo "## Staging Selective Deploy"
            echo ""
            echo "- Event: \\`$EVENT_NAME\\`"
            echo "- App Hosting: \\`$DEPLOY_APPHOSTING\\`"
            echo "- Firestore rules/indexes: \\`$DEPLOY_FIRESTORE\\`"
            echo "- Realtime Database rules: \\`$DEPLOY_DATABASE\\`"
            echo "- Storage rules: \\`$DEPLOY_STORAGE\\`"
            echo "- Functions core: \\`$DEPLOY_FUNCTIONS_CORE\\`"
            echo "- Functions media: \\`$DEPLOY_FUNCTIONS_MEDIA\\`"
            echo "- Functions image: \\`$DEPLOY_FUNCTIONS_IMAGE\\`"
            echo "- Functions integrations: \\`$DEPLOY_FUNCTIONS_INTEGRATIONS\\`"
            echo "- Anything to deploy: \\`$ANYTHING_TO_DEPLOY\\`"
            echo ""
            echo "### Changed Files"
            echo '\`\`\`'
            if [[ -n "$CHANGED_FILES" ]]; then
              echo "$CHANGED_FILES"
            else
              echo "<none>"
            fi
            echo '\`\`\`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        if: needs.detect-changes.outputs.anything_to_deploy == 'true'
        uses: actions/checkout@v4

      - name: Validate GCP OIDC secrets
        if: needs.detect-changes.outputs.anything_to_deploy == 'true'
        env:
          PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
        run: |
          set -euo pipefail
          if [[ -z "$PROVIDER" ]]; then
            echo "::error::Missing secret GCP_WORKLOAD_IDENTITY_PROVIDER"
            exit 1
          fi
          if [[ -z "$SERVICE_ACCOUNT" ]]; then
            echo "::error::Missing secret GCP_SERVICE_ACCOUNT_EMAIL"
            exit 1
          fi

      - name: Authenticate to Google Cloud (OIDC)
        if: needs.detect-changes.outputs.anything_to_deploy == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up Node.js
        if: needs.detect-changes.outputs.anything_to_deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        if: needs.detect-changes.outputs.anything_to_deploy == 'true'
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        if: needs.detect-changes.outputs.anything_to_deploy == 'true'
        run: pnpm install --frozen-lockfile

      - name: Deploy selected staging targets
        if: needs.detect-changes.outputs.anything_to_deploy == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
          DEPLOY_APPHOSTING: ${{ needs.detect-changes.outputs.deploy_apphosting }}
          DEPLOY_FIRESTORE: ${{ needs.detect-changes.outputs.deploy_firestore }}
          DEPLOY_DATABASE: ${{ needs.detect-changes.outputs.deploy_database }}
          DEPLOY_STORAGE: ${{ needs.detect-changes.outputs.deploy_storage }}
          DEPLOY_FUNCTIONS_CORE: ${{ needs.detect-changes.outputs.deploy_functions_core }}
          DEPLOY_FUNCTIONS_MEDIA: ${{ needs.detect-changes.outputs.deploy_functions_media }}
          DEPLOY_FUNCTIONS_IMAGE: ${{ needs.detect-changes.outputs.deploy_functions_image }}
          DEPLOY_FUNCTIONS_INTEGRATIONS: ${{ needs.detect-changes.outputs.deploy_functions_integrations }}
        run: |
          set -euo pipefail

          deployed_targets=()

          if [[ "$DEPLOY_APPHOSTING" == "true" ]]; then
            APPHOSTING_BACKEND="web-staging"
            APPHOSTING_REGION="us-central1"
            APPHOSTING_COMMIT="$GITHUB_SHA"

            find_apphosting_build_for_commit() {
              gcloud builds list \
                --project "$FIREBASE_PROJECT" \
                --region "$APPHOSTING_REGION" \
                --sort-by=~createTime \
                --limit=50 \
                --format=json \
                | jq -r --arg sha "$APPHOSTING_COMMIT" '
                    .[]
                    | select(((.tags // []) | index($sha)) != null)
                    | .id
                  ' \
                | head -n 1
            }

            apphosting_build_id="$(find_apphosting_build_for_commit || true)"

            if [[ -z "$apphosting_build_id" ]]; then
              pnpm exec firebase apphosting:rollouts:create "$APPHOSTING_BACKEND" \
                --project "$FIREBASE_PROJECT" \
                --git-commit "$APPHOSTING_COMMIT" \
                --force
              sleep 5
              apphosting_build_id="$(find_apphosting_build_for_commit || true)"
            fi

            if [[ -z "$apphosting_build_id" ]]; then
              echo "::error::Unable to locate App Hosting build for commit $APPHOSTING_COMMIT"
              exit 1
            fi

            apphosting_status=""
            for _ in {1..180}; do
              apphosting_status="$(gcloud builds describe "$apphosting_build_id" \
                --project "$FIREBASE_PROJECT" \
                --region "$APPHOSTING_REGION" \
                --format='value(status)')"
              if [[ "$apphosting_status" == "SUCCESS" ]]; then
                break
              fi
              if [[ "$apphosting_status" == "FAILURE" || "$apphosting_status" == "CANCELLED" || "$apphosting_status" == "TIMEOUT" || "$apphosting_status" == "EXPIRED" || "$apphosting_status" == "INTERNAL_ERROR" ]]; then
                apphosting_log_url="$(gcloud builds describe "$apphosting_build_id" \
                  --project "$FIREBASE_PROJECT" \
                  --region "$APPHOSTING_REGION" \
                  --format='value(logUrl)')"
                echo "::error::App Hosting build $apphosting_build_id failed with status $apphosting_status"
                echo "::error::Build logs: $apphosting_log_url"
                exit 1
              fi
              sleep 20
            done

            if [[ "$apphosting_status" != "SUCCESS" ]]; then
              echo "::error::Timed out waiting for App Hosting build $apphosting_build_id to finish"
              exit 1
            fi

            deployed_targets+=("apphosting:web-staging:$apphosting_build_id")
          fi

          if [[ "$DEPLOY_FIRESTORE" == "true" ]]; then
            pnpm exec firebase deploy --project "$FIREBASE_PROJECT" --only firestore:rules,firestore:indexes --non-interactive
            deployed_targets+=("firestore:rules")
            deployed_targets+=("firestore:indexes")
          fi

          if [[ "$DEPLOY_DATABASE" == "true" ]]; then
            pnpm exec firebase deploy --project "$FIREBASE_PROJECT" --only database:rtdb --non-interactive
            deployed_targets+=("database:rtdb")
          fi

          if [[ "$DEPLOY_STORAGE" == "true" ]]; then
            pnpm exec firebase deploy --project "$FIREBASE_PROJECT" --only storage --non-interactive
            deployed_targets+=("storage")
          fi

          if [[ "$DEPLOY_FUNCTIONS_CORE" == "true" ]]; then
            pnpm exec firebase deploy --project "$FIREBASE_PROJECT" --only functions:core --non-interactive --force
            deployed_targets+=("functions:core")
          fi

          if [[ "$DEPLOY_FUNCTIONS_MEDIA" == "true" ]]; then
            pnpm exec firebase deploy --project "$FIREBASE_PROJECT" --only functions:media --non-interactive --force
            deployed_targets+=("functions:media")
          fi

          if [[ "$DEPLOY_FUNCTIONS_IMAGE" == "true" ]]; then
            pnpm exec firebase deploy --project "$FIREBASE_PROJECT" --only functions:image --non-interactive --force
            deployed_targets+=("functions:image")
          fi

          if [[ "$DEPLOY_FUNCTIONS_INTEGRATIONS" == "true" ]]; then
            pnpm exec firebase deploy --project "$FIREBASE_PROJECT" --only functions:integrations --non-interactive --force
            deployed_targets+=("functions:integrations")
          fi

          {
            echo "### Deployed Targets"
            echo ""
            if [[ "${#deployed_targets[@]}" -eq 0 ]]; then
              echo "No targets deployed."
            else
              for target in "${deployed_targets[@]}"; do
                echo "- \\`$target\\`"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: No-op for non-deployable changes
        if: needs.detect-changes.outputs.anything_to_deploy != 'true'
        run: echo "No deployable changes detected for staging."
