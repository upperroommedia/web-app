runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 20
  concurrency: 80

scripts:
  runCommand: node apps/web/.next/standalone/apps/web/server.js

outputFiles:
  serverApp:
    include:
      - apps/web/.next/standalone
      - apps/web/.next/static
      - apps/web/public

env:
  - variable: NODE_ENV
    value: production
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: urm-app-staging
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyCq1bYko6pdD0eg0BMT2wPJegHSkjf4cB4
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:251680231116:web:8b28ca0f433c10367e7c69
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: '251680231116'
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: urm-app-staging.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: urm-app-staging.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_DATABASE_URL
    value: https://urm-app-staging-default-rtdb.firebaseio.com/
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_FUNCTIONS_URL
    value: https://us-central1-urm-app-staging.cloudfunctions.net
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_IMAGES_BUCKET
    value: urm-app-staging-images
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_ALGOLIA_APP_ID
    value: PRYE69L8IB
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_ALGOLIA_API_KEY
    secret: ALGOLIA_SEARCH_API_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: FIREBASE_PROJECT_ID
    value: urm-app-staging
    availability:
      - RUNTIME
  - variable: FIREBASE_STORAGE_BUCKET
    value: urm-app-staging.firebasestorage.app
    availability:
      - RUNTIME
  - variable: FIREBASE_DATABASE_URL
    value: https://urm-app-staging-default-rtdb.firebaseio.com/
    availability:
      - RUNTIME
  - variable: FIREBASE_IMAGES_BUCKET
    value: urm-app-staging-images
    availability:
      - RUNTIME
  - variable: FIREBASE_FUNCTIONS_REGION
    value: us-central1
    availability:
      - RUNTIME

  - variable: ADMIN_REQUEST_RECIPIENTS
    secret: ADMIN_REQUEST_RECIPIENTS
    availability:
      - RUNTIME
  - variable: RUNTIME_ALERT_RECIPIENTS
    secret: RUNTIME_ALERT_RECIPIENTS
    availability:
      - RUNTIME
  - variable: ADMIN_BASE_URL
    secret: ADMIN_BASE_URL
    availability:
      - RUNTIME
  - variable: SUBSPLASH_EMAIL
    secret: SUBSPLASH_EMAIL
    availability:
      - RUNTIME
  - variable: SUBSPLASH_PASSWORD
    secret: SUBSPLASH_PASSWORD
    availability:
      - RUNTIME
  - variable: ALGOLIA_SEARCH_API_KEY
    secret: ALGOLIA_SEARCH_API_KEY
