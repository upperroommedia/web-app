options:
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '--build-arg',
        'CACHEBUST=${COMMIT_SHA}',
        '-f',
        'apps/browser-fallback/Dockerfile',
        '-t',
        '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:${COMMIT_SHA}',
        '.',
      ]

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:${COMMIT_SHA}']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - -ceu
      - |
        DEPLOY_ARGS=(
          run deploy "${_SERVICE_NAME}"
          --project "${_PROJECT_ID}"
          --image "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:${COMMIT_SHA}"
          --region "${_REGION}"
          --platform managed
          --service-account "${_SERVICE_ACCOUNT}"
          --cpu "${_CPU}"
          --memory "${_MEMORY}"
          --concurrency "${_CONCURRENCY}"
          --min-instances "${_MIN_INSTANCES}"
          --max-instances "${_MAX_INSTANCES}"
          --timeout "${_TIMEOUT}"
          --update-env-vars "NODE_ENV=production,FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID},FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET},FIREBASE_DATABASE_URL=${_FIREBASE_DATABASE_URL},BROWSER_FALLBACK_PROFILE_BUCKET=${_PROFILE_BUCKET},BROWSER_FALLBACK_PROFILE_OBJECT=${_PROFILE_OBJECT},BROWSER_FALLBACK_PROFILE_META_OBJECT=${_PROFILE_META_OBJECT},BROWSER_FALLBACK_ARTIFACT_PREFIX=${_ARTIFACT_PREFIX},BROWSER_FALLBACK_SIGNED_URL_TTL_SECONDS=${_SIGNED_URL_TTL_SECONDS},BROWSER_FALLBACK_FAKE_MODE=${_FAKE_MODE}"
        )

        if [[ -n "${_NETWORK}" && -n "${_SUBNET}" ]]; then
          DEPLOY_ARGS+=(--network "${_NETWORK}" --subnet "${_SUBNET}" --vpc-egress all-traffic)
        fi

        gcloud beta "${DEPLOY_ARGS[@]}"

images:
  - '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:${COMMIT_SHA}'

substitutions:
  _PROJECT_ID: 'urm-app'
  _REGION: 'us-central1'
  _AR_REPO: 'process-audio-repo'
  _IMAGE_NAME: 'browser-fallback'
  _SERVICE_NAME: 'browser-fallback'
  _SERVICE_ACCOUNT: ''
  _CPU: '2'
  _MEMORY: '4Gi'
  _CONCURRENCY: '1'
  _MIN_INSTANCES: '0'
  _MAX_INSTANCES: '1'
  _TIMEOUT: '1800'
  _FIREBASE_PROJECT_ID: 'urm-app'
  _FIREBASE_STORAGE_BUCKET: 'urm-app.appspot.com'
  _FIREBASE_DATABASE_URL: 'https://urm-app-default-rtdb.firebaseio.com/'
  _PROFILE_BUCKET: 'urm-app.appspot.com'
  _PROFILE_OBJECT: 'browser-fallback/profile/latest.tar.gz'
  _PROFILE_META_OBJECT: 'browser-fallback/profile/latest.json'
  _ARTIFACT_PREFIX: 'browser-fallback/artifacts'
  _SIGNED_URL_TTL_SECONDS: '900'
  _FAKE_MODE: 'false'
  _NETWORK: 'default'
  _SUBNET: 'default'
