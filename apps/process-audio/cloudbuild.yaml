# cloudbuild.yaml
options:
  substitutionOption: ALLOW_LOOSE
  logging: CLOUD_LOGGING_ONLY

steps:
  # Step 0: Pull previously cached image layers when available.
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: bash
    args:
      [
        '-ceu',
        'docker pull ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:${_CACHE_TAG} || exit 0',
      ]

  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
        'build',
        '--cache-from',
        '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:${_CACHE_TAG}',
        '--build-arg',
        'PROCESS_AUDIO_RUNTIME_PROFILE=cloudrun',
        '-f',
        'apps/process-audio/Dockerfile',
        '-t',
        '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:${COMMIT_SHA}',
        '-t',
        '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:${_CACHE_TAG}',
        '.',
      ]

  # Step 2: Push Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:${COMMIT_SHA}']

  # Step 3: Refresh the shared cache tag with the freshly built image.
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:${_CACHE_TAG}']

  # Step 4: Deploy the storage-only Cloud Run service.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - -ceu
      - |
        set_secrets="RUNTIME_ALERT_RECIPIENTS=${_RUNTIME_ALERT_RECIPIENTS_SECRET}:latest"

        DEPLOY_ARGS=(
          deploy "${_SERVICE_NAME}"
          --project "${_PROJECT_ID}"
          --image "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:${COMMIT_SHA}"
          --region "${_REGION}"
          --platform managed
          --cpu "${_CPU}"
          --memory "${_MEMORY}"
          --cpu-boost
          --cpu-throttling
          --concurrency "${_CONCURRENCY}"
          --min-instances "${_MIN_INSTANCES}"
          --max-instances "${_MAX_INSTANCES}"
          --timeout "${_TIMEOUT}"
          --set-secrets "$${set_secrets}"
          --set-env-vars "NODE_ENV=production,FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID},FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET},FIREBASE_DATABASE_URL=${_FIREBASE_DATABASE_URL},PROCESS_AUDIO_RUNTIME_PROFILE=cloudrun,PROCESS_AUDIO_RUNTIME_HOST=cloud-run,PROCESS_AUDIO_RUNTIME_ENV=${_RUNTIME_ENV}"
        )

        if [[ -n "${_NETWORK}" && -n "${_SUBNET}" ]]; then
          DEPLOY_ARGS+=(--network "${_NETWORK}" --subnet "${_SUBNET}" --vpc-egress all-traffic)
        fi

        gcloud run "${DEPLOY_ARGS[@]}"

images:
  - '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:${COMMIT_SHA}'
  - '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:${_CACHE_TAG}'

substitutions:
  _PROJECT_ID: 'urm-app'
  _REGION: 'us-central1'
  _AR_REPO: 'process-audio-repo'
  _IMAGE_NAME: 'process-audio'
  _CACHE_TAG: 'buildcache'
  _SERVICE_NAME: 'process-audio'
  _RUNTIME_ENV: 'production'
  _FIREBASE_PROJECT_ID: 'urm-app'
  _FIREBASE_STORAGE_BUCKET: 'urm-app.appspot.com'
  _FIREBASE_DATABASE_URL: 'https://urm-app-default-rtdb.firebaseio.com/'
  _RUNTIME_ALERT_RECIPIENTS_SECRET: 'RUNTIME_ALERT_RECIPIENTS'
  _CPU: '2'
  _MEMORY: '4Gi'
  _CONCURRENCY: '1'
  _MIN_INSTANCES: '0'
  _MAX_INSTANCES: '10'
  _TIMEOUT: '3600'
  _NETWORK: ''
  _SUBNET: ''
