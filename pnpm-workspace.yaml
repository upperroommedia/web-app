packages:
  - 'apps/*'
  - 'packages/*'
  - 'functions'
  - 'functions-core'
  - 'functions-media'
  - 'functions-image'
  - 'functions-integrations'

catalog:
  '@google-cloud/functions-framework': ^3.2.0
  '@google-cloud/storage': 7.19.0
  '@ts-ffmpeg/fluent-ffmpeg': ^2.0.4
  '@types/node': ^22.20.5
  '@typescript-eslint/eslint-plugin': ^8.71.1
  '@typescript-eslint/parser': ^8.71.1
  algoliasearch: ^5.59.0
  axios: ^1.20.0
  eslint: ^9.28.0
  eslint-plugin-import: ^2.29.1
  fast-average-color-node: ^3.1.0
  ffmpeg-static: ^5.2.0
  ffprobe-static: ^3.1.0
  firebase: ^12.17.1
  firebase-admin: ^13.7.0
  firebase-functions: ^7.4.0
  form-data: ^4.0.6
  google-auth-library: ^9.15.1
  headers: ^0.9.6
  https-proxy-agent: ^7.0.4
  image-size: ^2.0.4
  jest: ^29.7.0
  lodash: ^4.18.1
  mkdirp: ^2.1.6
  node-fetch: 3.3.2
  node-vibrant: ^4.0.3
  p-limit: ^6.2.0
  typescript: ^5.9.3
  uuid: ^11.1.1
  ytdl-core: ^4.11.5
overrides:
  '@grpc/grpc-js': 1.14.6
  '@google-cloud/storage': 7.19.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  algoliasearch: 5.59.0
  '@tootallnate/once': 3.0.1
  cookie: 0.7.0
  fast-xml-parser: 4.5.7
  preact: 10.28.4
  qs: 6.16.0
  tar: 7.5.10
  undici: 6.23.0
nodeLinker: hoisted
# Keep CI/local module layout stable and leave dependency installation explicit.
enableGlobalVirtualStore: false
verifyDepsBeforeRun: warn
shamefullyHoist: true
strictPeerDependencies: false
autoInstallPeers: true
sharedWorkspaceLockfile: true
linkWorkspacePackages: true
allowBuilds:
  '@firebase/util': true
  protobufjs: true
  ffmpeg-static: true
  sharp: true
  '@sentry/cli': true
  unrs-resolver: true
  esbuild: true
  workerd: true
