packages:
  - 'apps/*'
  - 'packages/*'
  - 'functions'
  - 'functions-core'
  - 'functions-media'
  - 'functions-image'
  - 'functions-integrations'
  - 'function-kits/*'

catalog:
  '@google-cloud/functions-framework': ^3.2.0
  '@google-cloud/storage': 8.4.0
  '@ts-ffmpeg/fluent-ffmpeg': ^2.0.4
  '@types/node': ^22.20.5
  '@typescript-eslint/eslint-plugin': ^8.71.1
  '@typescript-eslint/parser': ^8.71.1
  algoliasearch: ^5.59.0
  axios: ^1.20.0
  eslint: ^9.28.0
  eslint-plugin-import: ^2.29.1
  fast-average-color-node: ^3.1.0
  ffmpeg-static: ^5.2.0
  ffprobe-static: ^3.1.0
  firebase: ^13.0.0
  firebase-admin: ^14.5.0
  firebase-functions: ^7.4.0
  form-data: ^4.0.6
  google-auth-library: ^11.2.0
  headers: ^0.9.6
  https-proxy-agent: ^7.0.4
  image-size: ^2.0.4
  jest: ^30.5.2
  lodash: ^4.18.1
  mkdirp: ^2.1.6
  node-fetch: 3.3.2
  p-limit: ^6.2.0
  typescript: ^5.9.3
  uuid: ^11.1.1
  ytdl-core: ^4.11.5
overrides:
  '@grpc/grpc-js': 1.14.6
  '@google-cloud/storage': 8.4.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  algoliasearch: 5.59.0
  '@tootallnate/once': 3.0.1
  cookie: 0.7.0
  fast-xml-parser: 5.11.2
  cloudevents>uuid: 11.1.1
  get-uri>basic-ftp: 6.2.3
  preact: 10.28.4
  qs: 6.16.0
  serialize-javascript: 7.1.2
  tar: 7.5.22
  undici: 6.29.0
nodeLinker: hoisted
# Keep CI/local module layout stable and leave dependency installation explicit.
enableGlobalVirtualStore: false
verifyDepsBeforeRun: warn
shamefullyHoist: true
strictPeerDependencies: false
autoInstallPeers: true
sharedWorkspaceLockfile: true
linkWorkspacePackages: true
allowBuilds:
  '@firebase/util': true
  protobufjs: true
  ffmpeg-static: true
  sharp: true
  '@sentry/cli': true
  unrs-resolver: true
  esbuild: true
  workerd: true
  # Firebase CLI installs this optional native regex dependency on Linux.
  re2: true
  '@swc/core': true
  '@parcel/watcher': true
minimumReleaseAgeExclude:
  - '@sentry/browser-utils@11.7.0'
  - '@sentry/browser@11.7.0'
  - '@sentry/bundler-plugins@11.7.0'
  - '@sentry/cloudflare@11.7.0'
  - '@sentry/conventions@0.27.0'
  - '@sentry/core@11.7.0'
  - '@sentry/feedback@11.7.0'
  - '@sentry/nextjs@11.7.0'
  - '@sentry/node@11.7.0'
  - '@sentry/opentelemetry@11.7.0'
  - '@sentry/react@11.7.0'
  - '@sentry/replay-canvas@11.7.0'
  - '@sentry/replay@11.7.0'
  - '@sentry/server-runtime-injection@11.7.0'
  - '@sentry/server-utils@11.7.0'
  - '@sentry/vercel-edge@11.7.0'
  - '@videojs/core@10.1.0'
  - '@videojs/media@10.1.0'
  - '@videojs/native-hls-video@10.1.0'
  - '@videojs/react@10.1.0'
  - '@videojs/spf@10.1.0'
  - '@videojs/store@10.1.0'
  - '@videojs/utils@10.1.0'
patchedDependencies:
  firebase-functions-test@3.5.0: patches/firebase-functions-test@3.5.0.patch

# This checked-in patch migrates the test harness to modular Admin 14.
peerDependencyRules:
  allowedVersions:
    "firebase-functions-test@3.5.0>firebase-admin": ^14.5.0
minimumReleaseAgeStrict: true
